# Instabox connects with a loopback Host and carries the public host separately.
map $http_x_forwarded_host $birth_public_host {
    default $http_x_forwarded_host;
    "" $http_host;
}
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;
    gzip on;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'" always;
    add_header Cache-Control "no-cache" always;
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $birth_public_host;
        proxy_set_header X-Forwarded-Host $birth_public_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 16k;
        proxy_read_timeout 15s;
    }
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
}
